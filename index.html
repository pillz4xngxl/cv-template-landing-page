<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free CV template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="content">
      <h1>Download your Professional CV</h1>
      <p>Free template in Word format, ready to edit. Perfect for standing out in recruitment processes.</p>
      
      <form class="form">
        <input type="email" placeholder="Your email address" required> <br>
        <button type="submit">Download now</button>
      </form>
    </div>
    <div class="image">
      <img src="icon.png" alt="Plantilla CV">
    </div>
  </div>

</body>
</html>
